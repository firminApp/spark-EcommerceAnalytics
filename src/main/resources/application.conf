# =============================================================================
#  application.conf — Configuration externalisée (Partie 7 — Question 7.1)
#  Propriétaire : Membre A (BANIGANTE Kpapou) — Relecteur : Membre C
#
#  Règle du projet : aucun chemin, seuil de validation ou paramètre Spark
#  n'est codé en dur dans le code Scala. Toute clé absente ici retombe sur la
#  valeur par défaut définie dans com.ecommerce.utils.ConfigLoader.
#
#  Surcharge possible sans recompiler :
#    spark-submit --driver-java-options "-Dconfig.file=/chemin/prod.conf" ...
#    sbt "run all" -Dapp.spark.master=local[2]
# =============================================================================

app {

  name = "EcommerceAnalytics"

  spark {
    master            = "local[*]"
    shuffle.partitions = 8
    log-level         = "ERROR"   # passer à "WARN" ou "INFO" pour diagnostiquer
    # Seuil (en octets) au-delà duquel Spark cesse de broadcaster automatiquement.
    autoBroadcastJoinThreshold = 10485760
  }

  optimization {
    # Question 5.1 / 5.2 : ces deux drapeaux pilotent cache() et broadcast().
    # Les passer à false permet de mesurer le pipeline NON optimisé (Q5.3).
    enable-cache     = true
    enable-broadcast = true
    # Question 5.3 : exécuter le pipeline deux fois (sans puis avec optimisations)
    # et produire le tableau comparatif des durées.
    benchmark        = false
  }

  data {
    input {
      transactions = "src/main/resources/data/transactions.csv"
      users        = "src/main/resources/data/users.json"
      products     = "src/main/resources/data/products.parquet"
      merchants    = "src/main/resources/data/merchants.csv"
    }
    output {
      path = "output/"
      # Nombre de fichiers produits par jeu de résultats (1 = fichier unique,
      # pratique pour un livrable lisible par une équipe métier).
      coalesce = 1
      # Nombre de lignes du extrait de transactions enrichies sauvegardé.
      sample-size = 2000
    }
  }

  validation {
    transaction {
      min-amount        = 0.0
      timestamp-length  = 14
    }
    user {
      min-age    = 16
      max-age    = 100
      min-income = 0.0
    }
    product {
      min-price  = 0.0
      min-rating = 1.0
      max-rating = 5.0
    }
    merchant {
      min-commission = 0.0
      max-commission = 1.0
    }
  }

  business {
    # Question 3.3 : largeur de la fenêtre glissante (en jours).
    rolling-window-days     = 7
    # Question 3.3 : nombre de jours distincts d'activité définissant
    # un « utilisateur actif » sur la fenêtre glissante.
    active-user-min-days    = 5
    # Question 3.4 (bonus) : seuils de détection des transactions suspectes.
    suspicious {
      amount-deviation-pct  = 300.0
      max-delay-seconds     = 300
      risky-payment-method  = "CRYPTO"
      min-conditions        = 2
    }
    # Question 4.2 : horizon de rétention mis en avant dans la console.
    retention-focus-period  = 3
    # Question 4.3 (bonus) : nombre de quantiles pour les scores RFM.
    rfm-quantiles           = 5
    # Question 4.4 (bonus) : taille du top produits.
    top-products            = 10
  }
}
